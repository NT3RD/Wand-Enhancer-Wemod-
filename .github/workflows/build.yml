name: Build Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build web panel
        shell: pwsh
        run: |
          pnpm --dir web-panel install --frozen-lockfile
          pnpm --dir web-panel run build

      - name: Build solution
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild Wand-Enhancer.sln /m /t:Restore /p:RestorePackagesConfig=true
          & $msbuild Wand-Enhancer.sln /m /t:Build "/p:Configuration=Release" "/p:Platform=Any CPU"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer
          path: WandEnhancer/bin/Release/
